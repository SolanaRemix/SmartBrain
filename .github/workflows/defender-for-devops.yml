# .github/workflows/defender-for-devops.yml
name: 'Microsoft Defender For Devops'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '24 9 * * 6'
  workflow_dispatch:  # Add manual trigger for testing

jobs:
  MSDO:
    # Use ubuntu-latest for better compatibility
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the build

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js (required for some tools)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@v2
        id: msdo
        continue-on-error: true
        with:
          tools: 'eslint'  # Limit tools to speed up
          
      - name: Upload results to Security tab (if file exists)
        if: success() && steps.msdo.outputs.sarifFile != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
